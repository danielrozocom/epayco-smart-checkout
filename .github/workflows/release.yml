name: Release Plugin ZIP

on:
  push:
    tags:
      - 'v*.*.*'   # Triggers on tags like v1.2.4, v1.3.0, etc.

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build plugin ZIP
        run: |
          mkdir -p dist/epayco-smart-checkout
          # Copy plugin files (excluding dev files)
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='dist' \
                    --exclude='.gitignore' \
                    --exclude='*.zip' \
                    . dist/epayco-smart-checkout/
          cd dist
          zip -r ../epayco-smart-checkout.zip epayco-smart-checkout/
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ePayco Smart Checkout v${{ steps.version.outputs.VERSION }}"
          body: |
            ## v${{ steps.version.outputs.VERSION }}

            Descarga e instala el archivo ZIP desde el botón de Assets de abajo, o actualiza directamente desde tu panel de WordPress en **Plugins > Actualizaciones disponibles**.

            ### Instalación manual
            1. Ve a **Plugins > Añadir nuevo > Subir plugin** en tu panel de WordPress.
            2. Selecciona el archivo `epayco-smart-checkout.zip`.
            3. Instala y activa.
          files: epayco-smart-checkout.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
